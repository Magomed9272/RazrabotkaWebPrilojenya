<html>
    <head>
        <title>Самостоятельная работа</title>
    </head>
    <body>
        <form action="http://www.primer.ru/profile.php">
            <fieldset>
                <legend>Данные пользователя:</legend>
                Имя: <input type="text" name="name" size="30" />
                <br />
                Email: <input type="text" name="email" size="30" />
            </fieldset>
            <br />
            <fieldset>
                <legend>Ваше мнение:</legend>
                <p>Как вы узнали о нас?
                    <select name="source">
                        <option value="google">Google</option>
                        <option value="yandex">Незнаю что написать</option>
                        <option value="friends">и тд</option>
                    </select>
                </p>
                <p>Посетите ли вы наш сайт снова?
                    <br />
                    <input type="radio" name="visit" value="yes" /> Да
                    <input type="radio" name="visit" value="no" /> Нет
                    <input type="radio" name="visit" value="maybe" /> Возможно
                </p>
                <p>Комментарий:
                    <br />
                    <textarea name="comments" cols="40" rows="4"></textarea>
                </p>
                <input type="checkbox" name="news" checked="checked" />
                Я хочу получать рассылку с новостями сайта
                <br />
                <input type="submit" value="Отправить отзыв" />
            </fieldset>
        </form>
    </body>
</html>
